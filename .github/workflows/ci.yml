name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CRM.slnx

      - name: Build
        run: dotnet build CRM.slnx --no-restore -c Release

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test CRM.slnx --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f src/Host/CRM.API/Dockerfile -t crm-api:ci .
