<h2>Profile</h2>

<div class="content-block dx-card responsive-paddings">
  <div class="form-avatar">
    <img src="https://js.devexpress.com/Demos/WidgetsGallery/JSDemos/images/employees/04.png"/>
  </div>
  <span>{{ user()?.firstName ?? authStore.user()?.name }} {{ user()?.lastName }}</span>
  <br>
  <span>Roller: {{ authStore.roles().join(', ') }}</span>
</div>

@if (user(); as user) {
  <div class="content-block dx-card responsive-paddings">
    <dx-form id="form"
      [formData]="user"
      labelLocation="top"
      [colCountByScreen]="colCountByScreen"
      [readOnly]="true"
    >
      <dxi-item dataField="firstName"></dxi-item>
      <dxi-item dataField="lastName"></dxi-item>
      <dxi-item dataField="email"></dxi-item>
      <dxi-item dataField="roleName" [label]="{ text: 'Roles' }"></dxi-item>
      <dxi-item dataField="isActive" editorType="dxCheckBox"></dxi-item>
      <dxi-item dataField="createdAt" editorType="dxDateBox"></dxi-item>
    </dx-form>
  </div>
}
