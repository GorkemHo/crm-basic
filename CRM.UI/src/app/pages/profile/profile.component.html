<h2>Profile</h2>

<div class="content-block dx-card responsive-paddings">
  <div class="form-avatar">
    <img src="https://js.devexpress.com/Demos/WidgetsGallery/JSDemos/images/employees/04.png"/>
  </div>
  <span>{{employee?.firstName}} {{employee?.lastName}}</span>
  <br>
  <span>Roller: </span>
</div>

<div class="content-block dx-card responsive-paddings">
  <dx-form id="form"
    [formData]="employee"
    labelLocation="top"
    [colCountByScreen]="colCountByScreen"
    [readOnly]="true"
  >
  </dx-form>
</div>
