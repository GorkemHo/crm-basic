<h2>Customers</h2>

<dx-data-grid
  class="dx-card content-block"
  [dataSource]="dataSource"
  [showBorders]="false"
  [focusedRowEnabled]="true"
  [focusedRowIndex]="0"
  [columnAutoWidth]="true"
  [columnHidingEnabled]="true"
  (onExporting)="exportGrid($event)"
>
  <dxo-editing
    mode="popup"
    [allowAdding]="true"
    [allowUpdating]="true"
    [allowDeleting]="true"
    [useIcons]="true"
  >
    <dxo-popup title="Customer" [showTitle]="true" [width]="700" [height]="500">
    </dxo-popup>

    <dxo-form [colCount]="2">
      <dxi-item dataField="firstName"> </dxi-item>

      <dxi-item dataField="lastName"> </dxi-item>

      <dxi-item dataField="email"> </dxi-item>

      <dxi-item dataField="phoneNumber"> </dxi-item>

      <dxi-item dataField="companyId"> </dxi-item>

      <dxi-item dataField="isActive" editorType="dxSwitch"> </dxi-item>
    </dxo-form>
  </dxo-editing>

  <dxo-toolbar>
    <dxi-item name="addRowButton"> </dxi-item>

    <dxi-item name="searchPanel"> </dxi-item>

    <dxi-item name="exportButton"> </dxi-item>
  </dxo-toolbar>

  <dxo-paging [pageSize]="10"> </dxo-paging>

  <dxo-pager [showPageSizeSelector]="true" [showInfo]="true"> </dxo-pager>

  <dxo-selection
    mode="multiple"
    selectAllMode="page"
    showCheckBoxesMode="always"
  >
  </dxo-selection>

  <dxo-search-panel [visible]="true" [width]="300" placeholder="Ara...">
  </dxo-search-panel>

  <dxo-filter-row [visible]="true"> </dxo-filter-row>

  <dxo-header-filter [visible]="true"> </dxo-header-filter>

  <dxi-column type="buttons" [width]="120">
    <dxi-button name="edit"> </dxi-button>

    <dxi-button name="delete"> </dxi-button>
  </dxi-column>

  <dxi-column dataField="id" caption="Id" [allowEditing]="false" [width]="70">
  </dxi-column>

  <dxi-column dataField="firstName" caption="First Name">
    <dxi-validation-rule type="required" message="First name is required">
    </dxi-validation-rule>
  </dxi-column>

  <dxi-column dataField="lastName" caption="Last Name">
    <dxi-validation-rule type="required" message="Last name is required">
    </dxi-validation-rule>
  </dxi-column>

  <dxi-column dataField="email" caption="E-Mail">
    <dxi-validation-rule type="required" message="Email is required">
    </dxi-validation-rule>

    <dxi-validation-rule type="email" message="Invalid email">
    </dxi-validation-rule>
  </dxi-column>

  <dxi-column dataField="phoneNumber" caption="Phone Number"> </dxi-column>

  <!-- <dxi-column dataField="companyId" caption="Company Id">
    <dxi-validation-rule type="required" message="Company is required">
    </dxi-validation-rule>
  </dxi-column> -->
  <dxi-column dataField="companyId" caption="Company">
    <dxo-lookup [dataSource]="companies" valueExpr="id" displayExpr="companyName">
    </dxo-lookup>

    <dxi-validation-rule type="required" message="Company is required">
    </dxi-validation-rule>
  </dxi-column>

  <dxi-column dataField="isActive" caption="Is Active" dataType="boolean">
  </dxi-column>

  <dxi-column
    dataField="createdAt"
    caption="Create Date"
    dataType="date"
    [allowEditing]="false"
  >
  </dxi-column>

  <dxi-column
    dataField="updatedAt"
    caption="Update Date"
    dataType="date"
    [allowEditing]="false"
  >
  </dxi-column>

  <dxo-export [enabled]="true" [allowExportSelectedData]="true"> </dxo-export>
</dx-data-grid>
